# RabbitMQ settings OpenCTI's own documentation calls for.
# max_message_size: large enough for a full STIX bundle to pass through
# as one message rather than needing to be chunked.
# consumer_timeout: long enough that a slow worker isn't disconnected
# mid-task on a big import/export job.
max_message_size = 536870912
consumer_timeout = 86400000
